name: Build OBS VU Meter PRO - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022

    steps:

      - name: Checkout VU Meter
        uses: actions/checkout@v4

      - name: Clone official OBS plugin template
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git template

      - name: Copy plugin source
        shell: pwsh
        run: |
          Remove-Item template/src/* -Recurse -Force -ErrorAction SilentlyContinue

          Copy-Item src/* template/src/ -Recurse -Force

      - name: Copy plugin data
        shell: pwsh
        run: |
          if (Test-Path "data") {
            Remove-Item template/data/* -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item data/* template/data/ -Recurse -Force
          }

      - name: Configure plugin metadata
        shell: pwsh
        run: |
          $file = "template/buildspec.json"

          $spec = Get-Content $file -Raw | ConvertFrom-Json

          $spec.name = "obs-vu-meter-pro"
          $spec.displayName = "VU Meter PRO"
          $spec.version = "1.0.0"
          $spec.author = "Doctor DJ"
          $spec.website = "https://github.com/doctordj/obs-vu-meter-pro"
          $spec.email = ""

          $spec | ConvertTo-Json -Depth 20 | Set-Content $file

      - name: Copy plugin CMakeLists
        shell: pwsh
        run: |
          Copy-Item CMakeLists.txt template/CMakeLists.txt -Force

      - name: Build plugin
        shell: pwsh
        working-directory: template
        run: |
          .\.github\scripts\Build-Windows.ps1 `
            -Target x64 `
            -Configuration Release

      - name: Package plugin
        shell: pwsh
        run: |
          $release = "template/release/Release"

          if (!(Test-Path $release)) {
            throw "Release directory was not generated."
          }

          Compress-Archive `
            -Path "$release/*" `
            -DestinationPath "OBS-VU-Meter-PRO-Windows-x64.zip" `
            -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: OBS-VU-Meter-PRO-Windows-x64
          path: OBS-VU-Meter-PRO-Windows-x64.zip
          if-no-files-found: error
